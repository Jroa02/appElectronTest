name: Build and Release
on:
  push:
    tags:
      - "v*" # Solo se ejecutará en tags que comiencen con "v"
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo snap install snapcraft --classic
          npm run build:linux

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Archive build artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p release
          ls dist/*.deb 1>/dev/null 2>&1 && mv dist/*.deb release/ || echo "No .deb files found."
          ls dist/*.snap 1>/dev/null 2>&1 && mv dist/*.snap release/ || echo "No .snap files found."
          ls dist/*.AppImage 1>/dev/null 2>&1 && mv dist/*.AppImage release/ || echo "No .AppImage files found."
          ls mount-logs.sh 1>/dev/null 2>&1 && mv mount-logs.sh release/ || echo "No mount-logs.sh found."
        shell: bash

      - name: Archive build artifacts on macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release
          ls dist/*.dmg 1>/dev/null 2>&1 && mv dist/*.dmg release/ || echo "No .dmg files found."
        shell: bash

      - name: Archive build artifacts on Windows
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path release
          if (Test-Path "dist/*.exe") {
            Move-Item dist/*.exe release/
          } else {
            Write-Output "No .exe files found."
          }
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install Git and jq
        run: sudo apt-get install -y git jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create template markdown release
        run: |
          chmod +x ./scripts/generate-release-markdown.sh
          ./scripts/generate-release-markdown.sh

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest-artifacts
          path: ./release/linux
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: macos-latest-artifacts
          path: ./release/macos
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-latest-artifacts
          path: ./release/windows
        continue-on-error: true

      - name: Display structure of downloaded files
        run: ls -l ./release

      - name: Read release notes
        id: read_notes
        run: |
          {
            echo "NOTES<<EOF"
            cat ./release_notes.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: joutvhu/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.read_notes.outputs.NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          paths=(
            "./release/linux/*.deb"
            "./release/linux/*.snap"
            "./release/linux/*.AppImage"
            "./release/linux/mount-logs.sh"
            "./release/macos/*.dmg"
            "./release/windows/*.exe"
          )
          for path in "${paths[@]}"; do
            for file in $path; do
              if [ -f "$file" ]; then
                asset_name=$(basename "$file")
                content_type=$(file -b --mime-type "$file")
                upload_url="${UPLOAD_URL%\{*}"
                echo "Uploading: $asset_name ($content_type)"
                curl -s -H "Authorization: token $GITHUB_TOKEN" \
                     -H "Content-Type: $content_type" \
                     --data-binary @"$file" \
                     "${upload_url}?name=${asset_name}" || echo "Error uploading $file"
              else
                echo "File not found: $file"
              fi
            done
          done
